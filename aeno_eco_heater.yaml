# Custom make-all/tuya-local profile for AENO Eco Heater with display.
# Based on Tuya Things Data Model and LOCAL DPS from 2026-11-15.
name: AENO Eco Heater (with display)
products:
  - id: ik5evzjpiz4hagr2
    manufacturer: AENO
    model: Eco Heater with display
entities:
  - entity: climate
    name: Heating
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 0
          max: 40
      - id: 3
        type: integer
        name: current_temperature
        unit: C
      - id: 11
        type: string
        name: hvac_action
        mapping:
          - dps_val: heating
            value: heating
          - dps_val: idle
            value: idle
  - entity: select
    name: Heating mode
    category: config
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: smart
            value: Smart
          - dps_val: manual
            value: Manual
  - entity: lock
    name: Child lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
  - entity: number
    name: Panel temperature
    category: config
    class: temperature
    dps:
      - id: 102
        type: integer
        name: value
        unit: C
        range:
          min: 60
          max: 120
        mapping:
          - step: 5
  - entity: select
    name: Backlight level
    category: config
    dps:
      - id: 108
        type: string
        name: option
        mapping:
          - dps_val: "off"
            value: "Off"
          - dps_val: low
            value: Low
          - dps_val: medium
            value: Medium
          - dps_val: high
            value: High
  - entity: number
    name: LED brightness
    category: config
    dps:
      - id: 106
        type: integer
        name: value
        range:
          min: 0
          max: 250
  - entity: number
    name: Display brightness
    category: config
    dps:
      - id: 107
        type: integer
        name: value
        range:
          min: 0
          max: 100
  - entity: select
    name: Shutdown timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: Cancel
          - dps_val: 1h
            value: 1h
          - dps_val: 2h
            value: 2h
          - dps_val: 3h
            value: 3h
          - dps_val: 4h
            value: 4h
          - dps_val: 5h
            value: 5h
          - dps_val: 6h
            value: 6h
          - dps_val: 7h
            value: 7h
          - dps_val: 8h
            value: 8h
          - dps_val: 9h
            value: 9h
          - dps_val: 10h
            value: 10h
          - dps_val: 11h
            value: 11h
          - dps_val: 12h
            value: 12h
          - dps_val: 13h
            value: 13h
          - dps_val: 14h
            value: 14h
          - dps_val: 15h
            value: 15h
          - dps_val: 16h
            value: 16h
          - dps_val: 17h
            value: 17h
          - dps_val: 18h
            value: 18h
          - dps_val: 19h
            value: 19h
          - dps_val: 20h
            value: 20h
          - dps_val: 21h
            value: 21h
          - dps_val: 22h
            value: 22h
          - dps_val: 23h
            value: 23h
          - dps_val: 24h
            value: 24h
  - entity: sensor
    name: Power
    class: power
    dps:
      - id: 12
        type: integer
        name: sensor
        unit: W
        class: measurement
  - entity: sensor
    name: Total energy
    class: energy
    dps:
      - id: 101
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 1000
  - entity: sensor
    name: Outlet temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Voltage
    class: voltage
    category: diagnostic
    dps:
      - id: 109
        type: integer
        name: sensor
        unit: V
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Current
    class: current
    category: diagnostic
    dps:
      - id: 110
        type: integer
        name: sensor
        unit: mA
        class: measurement
  - entity: sensor
    name: Timer remaining
    class: duration
    category: diagnostic
    dps:
      - id: 20
        type: integer
        name: sensor
        unit: min
        class: measurement
  - entity: binary_sensor
    name: Fault
    class: problem
    category: diagnostic
    dps:
      - id: 21
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
